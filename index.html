<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>طلب الفواكه فآسفي</title>
<style>
  :root { --orange:#e8761a; --orange-d:#c25a0b; --orange-l:#fde7d2; --green:#1f8f3a; --green-d:#16702c;
    --ink:#3a2214; --muted:#6e5b4b; --bg:#fdf6ea; --line:#efe1c9; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); padding-bottom:150px;
    font:18px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif; }
  .top { background:var(--orange); color:#fff; padding:16px 16px 14px; text-align:center; }
  .top h1 { margin:0; font-size:24px; }
  .steps { display:flex; justify-content:center; gap:10px; margin:8px 0 0; font-size:14px; font-weight:700; flex-wrap:wrap; }
  .steps span { background:rgba(255,255,255,.2); border-radius:99px; padding:3px 12px; }
  h2 { font-size:19px; margin:18px 14px 8px; }
  h2 b { display:inline-block; width:28px; height:28px; line-height:28px; text-align:center; border-radius:50%;
    background:var(--orange); color:#fff; margin-left:6px; font-size:16px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 12px; max-width:640px; margin:0 auto; }
  .prod { background:#fff; border:3px solid var(--line); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; }
  .prod.on { border-color:var(--green); }
  .pimg { width:100%; aspect-ratio:1/1; object-fit:cover; background:var(--orange-l); display:flex;
    align-items:center; justify-content:center; font-size:60px; }
  .pbody { padding:8px 10px 10px; text-align:center; }
  .pname { font-weight:800; font-size:19px; line-height:1.25; }
  .pprice { color:var(--orange-d); font-weight:700; font-size:16px; margin-bottom:8px; }
  .add { width:100%; min-height:48px; border:0; border-radius:12px; background:var(--orange); color:#fff;
    font:inherit; font-size:18px; font-weight:800; cursor:pointer; }
  .qstep { display:none; align-items:center; justify-content:space-between; direction:ltr; }
  .prod.on .qstep { display:flex; }
  .prod.on .add { display:none; }
  .qstep button { width:48px; height:48px; border-radius:50%; border:0; background:var(--green); color:#fff;
    font-size:28px; font-weight:800; cursor:pointer; }
  .qstep output { font-weight:800; font-size:20px; }
  .details { max-width:640px; margin:0 auto; padding:0 12px; }
  .details input { width:100%; min-height:54px; margin-bottom:10px; padding:8px 14px; font:inherit;
    border:3px solid var(--line); border-radius:14px; background:#fff; }
  .details input.bad { border-color:#d33; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line);
    padding:10px 14px 14px; box-shadow:0 -4px 14px rgba(0,0,0,.08); }
  .bar > div { max-width:616px; margin:0 auto; }
  .meter { height:8px; border-radius:99px; background:#eadfce; overflow:hidden; margin-bottom:6px; }
  .meter i { display:block; height:100%; width:0; background:var(--green); transition:width .2s; }
  .info { display:flex; justify-content:space-between; gap:8px; font-weight:800; font-size:16px; margin-bottom:8px; }
  .btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; min-height:58px;
    border:0; border-radius:999px; background:var(--green); color:#fff; font:inherit; font-size:20px;
    font-weight:800; cursor:pointer; box-shadow:0 6px 16px rgba(31,143,58,.28); }
  .btn:disabled { background:#b9b2a8; box-shadow:none; }
  .btn svg { width:26px; height:26px; flex:none; }
  .note { text-align:center; font-size:14px; color:var(--muted); margin:6px 14px 0; }
</style>
</head>

  <div class="steps"><span>1. اختار</span><span>2. كتب السمية</span><span>3. صيفط</span></div>

<h2><b>1</b>اختار الفاكهة <small style="font-weight:400;color:var(--muted)">(أقل طلب <span id="minKg"></span> كيلو)</small></h2>
<div class="grid" id="prodList"></div>

</div></div>

var source = (new URLSearchParams(location.search).get("src") || "").replace(/[^\w-]/g, "").slice(0, 20);
var qty = CONFIG.products.map(function () { return 0; });
var rows = [];

function byId(id) { return document.getElementById(id); }
function totalKg() { return qty.reduce(function (a, b) { return a + b; }, 0); }
function totalPrice() {
  return qty.reduce(function (a, k, i) { return a + k * CONFIG.products[i].price; }, 0);
}

function buildMessage() {
  var lines = ["سلام، بغيت نطلب:"];
  CONFIG.products.forEach(function (p, i) {
    if (qty[i] > 0) { lines.push("- " + p.name + ": " + qty[i] + " كيلو (" + qty[i] * p.price + " درهم)"); }
  });
  lines.push("الفواكه: " + totalKg() + " كيلو = " + totalPrice() + " درهم");
  lines.push("التوصيل: " + CONFIG.deliveryFee + " درهم");
  lines.push("المجموع: " + (totalPrice() + CONFIG.deliveryFee) + " درهم");
  lines.push("السمية: " + byId("p-name").value.trim());
  lines.push("الحي: " + byId("p-zone").value.trim());
  if (source) { lines.push("(ref: " + source + ")"); }
  return lines.join("\n");
}

function refresh() {
  var kg = totalKg(), min = CONFIG.minKg;
  qty.forEach(function (k, i) {
    rows[i].row.classList.toggle("on", k > 0);
    rows[i].out.textContent = k + " كغ";
    rows[i].minus.disabled = k <= 0;
  });
  byId("totKg").textContent = kg + " كيلو من " + min;
  byId("totPrice").textContent = kg ? (totalPrice() + CONFIG.deliveryFee) + " درهم (مع التوصيل)" : "";
  byId("meterBar").style.width = Math.min(100, kg / min * 100) + "%";
  var hasName = byId("p-name").value.trim() !== "";
  var hasZone = byId("p-zone").value.trim() !== "";
  byId("popSend").disabled = !(kg >= min && hasName && hasZone);
  byId("sendTxt").textContent = kg < min ? "باقي " + (min - kg) + " كيلو" :
    (!hasName || !hasZone) ? "كتب السمية والحي" : "صيفط الطلب فالواتساب";
}

function build() {
  byId("minKg").textContent = CONFIG.minKg;
  byId("feeTxt").textContent = CONFIG.deliveryFee;
  CONFIG.products.forEach(function (p, i) {
    var row = document.createElement("div");
    row.className = "prod";
    var pic;
    if (p.img) {
      pic = document.createElement("img");
      pic.src = p.img; pic.alt = p.name; pic.loading = "lazy";
    } else {
      pic = document.createElement("div");
      pic.textContent = p.emoji || "🍎";
    }
    pic.className = "pimg";
    var info = document.createElement("div"); info.className = "pbody";
    var n = document.createElement("div"); n.className = "pname"; n.textContent = p.name;
    var pr = document.createElement("div"); pr.className = "pprice"; pr.textContent = p.price + " درهم / كيلو";
    var add = document.createElement("button"); add.type = "button"; add.className = "add";
    add.textContent = "+ زيد";
    add.addEventListener("click", function () { qty[i] += CONFIG.stepKg; refresh(); });
    info.appendChild(n); info.appendChild(pr); info.appendChild(add);
    var step = document.createElement("div"); step.className = "qstep";
    var minus = document.createElement("button"); minus.type = "button"; minus.textContent = "−";
    minus.setAttribute("aria-label", "نقص");
    var out = document.createElement("output");
    var plus = document.createElement("button"); plus.type = "button"; plus.textContent = "+";
    plus.setAttribute("aria-label", "زيد");
    step.appendChild(minus); step.appendChild(out); step.appendChild(plus);
    minus.addEventListener("click", function () { qty[i] = Math.max(0, qty[i] - CONFIG.stepKg); refresh(); });
    plus.addEventListener("click", function () { qty[i] += CONFIG.stepKg; refresh(); });
    info.appendChild(step);
    row.appendChild(pic); row.appendChild(info);
    byId("prodList").appendChild(row);
    rows.push({ row: row, out: out, minus: minus });
  });
  refresh();
}

build();
["p-name","p-zone"].forEach(function(id){byId(id).addEventListener("input",function(){byId(id).classList.remove("bad"); refresh();});});
byId("popSend").addEventListener("click", function () {
  var name = byId("p-name"), zone = byId("p-zone");
  name.classList.toggle("bad", !name.value.trim());
  zone.classList.toggle("bad", !zone.value.trim());
  if (!name.value.trim() || !zone.value.trim()) {
    (name.value.trim() ? zone : name).focus();
    return;
  }
  if (!byId("popSend").disabled) {
    window.location.href = "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(buildMessage());
  }
});
</script>
</body>
